  .modulex-sayac-kronometre { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }

  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-sayac-kronometre :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }

  .modulex-sayac-kronometre-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-sayac-kronometre-dugme:hover { transform: translateY(-2px); }
  .modulex-sayac-kronometre-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }

  .modulex-sayac-kronometre-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-sayac-kronometre-duzen { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: clamp(28px, 5vw, 80px); align-items: center; }
  .modulex-sayac-kronometre-saat { display: grid; justify-items: center; gap: 22px; }
  .modulex-sayac-kronometre-kurgu { width: 44px; height: 20px; margin-block-end: -24px; border-radius: 8px 8px 2px 2px; background: --text--; box-shadow: 0 -8px 0 -3px --muted--; }
  .modulex-sayac-kronometre-kadran { position: relative; width: min(100%, 400px); aspect-ratio: 1; border: 10px solid color-mix(in srgb, --text-- 85%, --accent--); border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, --accent-- 9%, transparent), transparent 62%), --kartBg--; box-shadow: 0 40px 80px -50px color-mix(in srgb, --accent-- 70%, transparent), inset 0 0 0 1px --cizgi--; }
  .modulex-sayac-kronometre-kadran::before, .modulex-sayac-kronometre-kadran::after { content: ""; position: absolute; inset: 4%; border-radius: 50%; pointer-events: none; }
  .modulex-sayac-kronometre-kadran::before { background: repeating-conic-gradient(--text-- 0 0.7deg, transparent 0.7deg 6deg); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 9px), black calc(100% - 8px)); mask: radial-gradient(farthest-side, transparent calc(100% - 9px), black calc(100% - 8px)); opacity: 0.4; }
  .modulex-sayac-kronometre-kadran::after { background: repeating-conic-gradient(from -1deg, --text-- 0 2deg, transparent 2deg 30deg); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 18px), black calc(100% - 17px)); mask: radial-gradient(farthest-side, transparent calc(100% - 18px), black calc(100% - 17px)); }
  .modulex-sayac-kronometre-yay { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  .modulex-sayac-kronometre-yay-taban, .modulex-sayac-kronometre-yay-dolu { fill: none; stroke-width: 3; }
  .modulex-sayac-kronometre-yay-taban { stroke: --cizgi--; }
  .modulex-sayac-kronometre-yay-dolu { stroke: --accent--; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: calc(100 - var(--aci) * 100); transition: stroke-dashoffset 1.2s cubic-bezier(0.34, 1.3, 0.64, 1); }
  .modulex-sayac-kronometre-ibre { position: absolute; inset-block: 12% 50%; inset-inline-start: calc(50% - 2px); width: 4px; border-radius: 4px; background: --accent--; transform: rotate(calc(var(--aci) * 1turn)); transform-origin: 50% 100%; transition: transform 1.2s cubic-bezier(0.34, 1.3, 0.64, 1); }
  .modulex-sayac-kronometre--hazir:not(.modulex-sayac-kronometre--gor) .modulex-sayac-kronometre-ibre { transform: rotate(0turn); }
  .modulex-sayac-kronometre--hazir:not(.modulex-sayac-kronometre--gor) .modulex-sayac-kronometre-yay-dolu { stroke-dashoffset: 100; }
  .modulex-sayac-kronometre-saniye { position: absolute; inset-block: 20% 50%; inset-inline-start: calc(50% - 0.5px); width: 1px; background: --muted--; transform-origin: 50% 100%; animation: modulex-sayac-kronometre-sn 60s steps(60) infinite; }
  @keyframes modulex-sayac-kronometre-sn { to { transform: rotate(1turn); } }
  .modulex-sayac-kronometre-gobek { position: absolute; inset-block-start: calc(50% - 10px); inset-inline-start: calc(50% - 10px); width: 20px; height: 20px; border: 5px solid --accent--; border-radius: 50%; background: --bg--; }
  .modulex-sayac-kronometre-ekran { width: min(100%, 320px); padding: 14px 24px; border: 1px solid --cizgi--; border-radius: 12px; background: color-mix(in srgb, --text-- 6%, transparent); font-family: var(--mx-font-mono, ui-monospace, monospace); text-align: center; }
  .modulex-sayac-kronometre-panel { animation: modulex-sayac-kronometre-yan 0.35s ease backwards; }
  .modulex-sayac-kronometre-dijital { display: block; font-size: clamp(2rem, 4.4vw, 3rem); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; line-height: 1.1; }
  .modulex-sayac-kronometre-panel-ad { color: --muted--; font-size: 0.82rem; letter-spacing: 0.08em; text-transform: uppercase; }
  .modulex-sayac-kronometre-ek { color: --accentInk--; font-size: 0.55em; }
  .modulex-sayac-kronometre-turlar { display: grid; border-block-start: 2px solid --text--; }
  .modulex-sayac-kronometre-tur { display: grid; grid-template-columns: 3ch minmax(0, 1fr) auto; align-items: center; gap: 4px 18px; width: 100%; padding: 16px 14px; border: 0; border-block-end: 1px solid --cizgi--; background: transparent; color: --text--; font: inherit; text-align: start; transition: background 0.25s ease, padding 0.3s ease, box-shadow 0.3s ease; }
  .modulex-sayac-kronometre:not(.modulex-sayac-kronometre--tjs) .modulex-sayac-kronometre-tur { cursor: default; }
  .modulex-sayac-kronometre--tjs .modulex-sayac-kronometre-tur:hover { background: color-mix(in srgb, --accent-- 8%, transparent); }
  .modulex-sayac-kronometre--tjs .modulex-sayac-kronometre-tur[aria-pressed="true"] { padding-inline-start: 22px; background: color-mix(in srgb, --accent-- 13%, transparent); box-shadow: inset 4px 0 0 --accent--; }
  [dir="rtl"] .modulex-sayac-kronometre--tjs .modulex-sayac-kronometre-tur[aria-pressed="true"] { box-shadow: inset -4px 0 0 --accent--; }
  .modulex-sayac-kronometre-tur-no { color: --accentInk--; font-family: var(--mx-font-mono, ui-monospace, monospace); font-size: 0.82rem; font-weight: 700; }
  .modulex-sayac-kronometre-tur-ad { display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 700; line-height: 1.3; }
  .modulex-sayac-kronometre-ikon { color: --accentInk--; font-size: 20px; }
  .modulex-sayac-kronometre-tur-sayi { font-family: var(--mx-font-mono, ui-monospace, monospace); font-size: 1.25rem; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .modulex-sayac-kronometre-tur-not { grid-column: 2 / -1; color: --muted--; font-size: 0.88rem; }
  @keyframes modulex-sayac-kronometre-yan { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (max-width: 768px) {
    .modulex-sayac-kronometre-duzen { grid-template-columns: minmax(0, 1fr); }
    .modulex-sayac-kronometre-kadran { width: min(100%, 290px); border-width: 7px; }
    .modulex-sayac-kronometre-tur { gap: 4px 12px; padding-inline: 8px; }
  }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-kronometre :is(.modulex-sayac-kronometre-baslik, .modulex-sayac-kronometre-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-kronometre-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-sayac-kronometre { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-sayac-kronometre *, .modulex-sayac-kronometre *::before, .modulex-sayac-kronometre *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-sayac-kronometre";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const gozlem = (s, P, az) => {
        const gor = () => s.classList.add(P + "--gor");
        s.classList.add(P + "--hazir");
        if (az || !("IntersectionObserver" in window)) { gor(); return; }
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { gor(); io.disconnect(); } });
        }, { threshold: 0.15 });
        io.observe(s);
      };
    const sayac = (s, P, az) => {
        const el = [...s.querySelectorAll("[data-hedef]")];
        if (!el.length || az || !("IntersectionObserver" in window)) return;
        const dl = document.documentElement.lang || undefined;
        const oynat = () => el.forEach((e) => {
          const h = Number(e.dataset.hedef);
          const od = Number(e.dataset.ondalik) || 0;
          const son = e.textContent;
          if (!Number.isFinite(h)) return;
          let f;
          try { f = new Intl.NumberFormat(dl, { minimumFractionDigits: od, maximumFractionDigits: od }); } catch (x) { return; }
          const t0 = performance.now();
          const adim = (t) => {
            const p = Math.min(1, (t - t0) / 1300);
            e.textContent = p < 1 ? f.format(h * (1 - Math.pow(1 - p, 3))) : son;
            if (p < 1) requestAnimationFrame(adim);
          };
          requestAnimationFrame(adim);
        });
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { oynat(); io.disconnect(); } });
        }, { threshold: 0.3 });
        io.observe(s);
      };
    const tur = (s, P) => {
        const t = [...s.querySelectorAll("[data-tur]")];
        const k = s.querySelector("[data-tur-kadran]");
        if (t.length < 2 || !k) return;
        const p = [...s.querySelectorAll("[data-tur-panel]")];
        s.classList.add(P + "--tjs");
        const sec = (i, odak) => {
          t.forEach((b, j) => { b.setAttribute("aria-pressed", String(i === j)); b.tabIndex = i === j ? 0 : -1; });
          p.forEach((x, j) => { x.hidden = i !== j; });
          k.style.setProperty("--aci", t[i].dataset.oran || "0");
          if (odak) t[i].focus();
        };
        t.forEach((b, i) => {
          b.addEventListener("click", () => sec(i));
          b.addEventListener("keydown", (e) => {
            let n = -1;
            if (e.key === "ArrowDown") n = (i + 1) % t.length;
            else if (e.key === "ArrowUp") n = (i - 1 + t.length) % t.length;
            else if (e.key === "Home") n = 0;
            else if (e.key === "End") n = t.length - 1;
            if (n > -1) { e.preventDefault(); sec(n, true); }
          });
        });
        sec(0);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      gozlem(s, P, az);
      sayac(s, P, az);
      tur(s, P, az);
    });
  })();
</script>
